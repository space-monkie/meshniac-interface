; PlatformIO env for developing this LIBRARY standalone (IntelliSense + LDF).
; This repo has no sketch (no setup()/loop()), so `pio run` will not link —
; consumers compile it. Envs mirror the consumers listed in README.md.

[platformio]
default_envs = esp32doit-devkit-v1

; HOST m1 — HOST_m1-t2-r16_v1 (ESP32 DevKit, bench hardware - nothing deployed as of 2026-09-30)
[env:esp32doit-devkit-v1]
platform = espressif32
board = esp-wrover-kit
framework = arduino
lib_deps =
	bblanchon/ArduinoJson@^6.19.4
	fbiego/ESP32Time @ ^2.0.0

; HOST m2 — host_m2 (ESP32-S3-WROOM-1-N16R8). Only the compile-affecting
; flags from host_m2/platformio.ini: qio_opi picks the S3 sdkconfig, and the
; USB-CDC flags change the type of `Serial` used by the debug prints.
[env:m2_esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
build_flags =
	-DBOARD_HAS_PSRAM
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
	bblanchon/ArduinoJson@^6.19.4
	fbiego/ESP32Time @ ^2.0.0

; HOST M3 — host_m3 (ESP32-S3-DevKitC-1 dev board, design phase). Same
; compile-affecting flags as m2; the TFT/sensor deps live only in host_m3.
[env:m3_esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
build_flags =
	-DBOARD_HAS_PSRAM
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
	bblanchon/ArduinoJson@^6.19.4
	fbiego/ESP32Time @ ^2.0.0
